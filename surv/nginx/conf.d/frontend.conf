# nginx/conf.d/frontend.conf
# Serves the React SPA. Falls back to index.html for client-side routing.

server {
    listen 8080;
    listen 8443 ssl;
    server_name sarvanetra.bsnl.co.in localhost _;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Optional: SSL certs if mounted (won't crash if omitted if we use conditional loading, 
    # but for simplicity we assume they exist or we map dummy ones)
    ssl_certificate     /certs/star_bsnl_co_in.crt;
    ssl_certificate_key /certs/star_bsnl_co_in.key;

    root  /usr/share/nginx/html;
    index index.html;

    # Health check
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Static assets — long cache
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # Proxy API calls to FastAPI — avoids CORS issues in production
    location /api/ {
        set $app_upstream  http://app:8000;
        proxy_pass         $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy HLS to avoid Mixed Content (HTTP on HTTPS)
    location /hls/ {
        set $hls_upstream  http://nginx_hls:80;
        proxy_pass         $hls_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Proxy MinIO buckets through same HTTPS origin to avoid mixed-content
    # blocking in browsers when playback URLs are opened from the secure UI.
    location /recordings/ {
        set $minio_upstream http://minio:9000;
        proxy_pass         $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /snapshots/ {
        set $minio_upstream http://minio:9000;
        proxy_pass         $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # React SPA — all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
