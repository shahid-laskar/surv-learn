# mediamtx/mediamtx-edge.yml
# Lightweight MediaMTX config for simulated edge NVR sites.
# - No MinIO upload (recordings stay local only)
# - No auth (RTSP traffic is internal to the site's Docker network)
# - Local recording only
# - All simulated cameras publish via RTSP path

logLevel: info
logDestinations: [stdout]
logFile: ""

# No auth for edge — internal traffic only (real edge would use WireGuard overlay)
# MediaMTX v1.19+ requires explicit authInternalUsers even for open/internal mode.
# Without this, all API calls and RTSP publishes from unauthenticated clients return 401/400.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: publish
      - action: read
      - action: playback

# Control API
api: true
apiAddress: :9997

# RTSP
rtsp: true
rtspAddress: :8554
rtspEncryption: "no"

# HLS (for stream-branching tests — serves directly from edge overlay IP)
hls: true
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigins:
  - "*"
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsDirectory: /var/hls

# WebRTC
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins:
  - "*"
webrtcICEServers2: []

# RTMP off (not needed for simulation)
rtmp: false

# Path defaults — local recording, no segment callbacks
pathDefaults:
  record: true
  recordPath: /recordings/%path/%Y/%m/%d/%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  recordDeleteAfter: 0s
  # No runOnRecordSegmentComplete — edge stores locally; backup_uploader handles critical clips

# Paths populated dynamically at runtime by the ffmpeg camera containers
paths: {}
