# MediaMTX config for portable edge NVR appliances.
# Pulls RTSP from LAN cameras; records locally; serves HLS on :8888.

logLevel: info
logDestinations: [stdout]

# ── Authentication ──────────────────────────────────────────────────────────
# In multi-site deployments, Edge MediaMTX authenticates viewer read/playback
# requests against the Hub's stream auth webhook over the overlay/LAN network.
authMethod: http
authHTTPAddress: http://host.docker.internal:8000/api/v1/auth/stream
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: true
apiAddress: :9997
apiAllowOrigins: ["*"]

rtsp: true
rtspAddress: :8554
rtspEncryption: "no"

hls: true
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsDirectory: /var/hls

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ["*"]

rtmp: false

pathDefaults:
  sourceOnDemand: true
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 30s
  record: true
  recordPath: /recordings/%path/%Y/%m/%d/%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  recordDeleteAfter: 0s

paths: {}
