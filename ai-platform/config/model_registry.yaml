# SARVANETRA AI Model Registry Specification
# Document Version: 1.1 (Reconciled Acceptance Specification)
# Distinguishes between active prototype artifacts on disk and target production candidates.

models:
  # ── Active On-Disk Runtime Prototypes (Validation & Integration Only) ────────
  - name: "yolov8n-detector-prototype"
    version: "8.2.0"
    task: "object_detection"
    framework: "Ultralytics YOLOv8n"
    runtime: "onnxruntime"
    artifact_path: "models/yolov8n_320.onnx"
    artifact_sha256: "e33be869d4b90936837e1005dda5d3387de7a16a51367b59df7e9c639a34f2dc"
    license: "AGPL-3.0"
    status: "PROTOTYPE-ONLY"
    commercial_cleared: false
    input_size: [320, 320]
    classes: ["person", "bicycle", "car", "motorcycle", "bus", "truck"]
    confidence_threshold: 0.40
    nms_iou_threshold: 0.45
    preferred_device: "cpu"
    enabled: true

  - name: "yolov8n-pose-prototype"
